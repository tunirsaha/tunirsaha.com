<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edeae2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15151c" media="(prefers-color-scheme: dark)" />
  <title>404 — page not found | Tunir Saha</title>
  <!-- noindex, follow: a 404 must never be indexed, but its links should still
       be crawled. Paired with ErrorDocument 404 in .htaccess — without that line
       the host serves its own default error page instead of this one. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <!-- deliberately self-contained: no stylesheet, no script, no external host.
       if this page ever renders during a broken deploy, it must not depend on
       anything that could itself be missing. -->
  <style>
    :root { color-scheme: light dark; --bg:#edeae2; --fg:#15151c; --dim:#6b6b78; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15151c; --fg:#edeae2; --dim:#9a9aa8; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      display: flex; align-items: center; justify-content: center; padding: 2rem;
      font: 400 clamp(1rem, 0.9rem + 0.4vw, 1.125rem)/1.6
            ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 34rem; }
    .code { font: 700 clamp(3.5rem, 3rem + 6vw, 7rem)/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -0.04em; margin: 0; }
    h1 { font-size: clamp(1.25rem, 1.1rem + 0.7vw, 1.75rem); margin: 0.75rem 0 0; letter-spacing: -0.01em; }
    p { color: var(--dim); margin: 1rem 0 2rem; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; }
    a { color: var(--fg); text-decoration-thickness: 2px; text-underline-offset: 0.25em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>That page isn't here.</h1>
    <p>
      The site itself is fine — this particular URL just doesn't exist.
      Everything below does.
    </p>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/projects/billmate/">BillMate</a></li>
      <li><a href="/projects/between/">Between</a></li>
      <li><a href="/Tunir_Saha_Resume.pdf">Résumé (PDF)</a></li>
      <li><a href="/llms.txt">llms.txt</a></li>
    </ul>
  </main>
</body>
</html>
